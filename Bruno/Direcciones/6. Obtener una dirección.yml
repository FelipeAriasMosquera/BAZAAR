info:
  name: 6. Obtener una dirección
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/direcciones/{{direccionId}}"
  auth: inherit
  
runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080
  

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
  
  
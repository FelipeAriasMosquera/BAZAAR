info:
  name: 2. Obtener usuario
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/usuarios/{{usuarioId}}"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: "http://localhost:8080 "

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

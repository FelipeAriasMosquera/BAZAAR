info:
  name: 3. Crear dirección (queda como principal por ser la primera)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/direcciones"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "alias": "Casa",
        "calle": "Calle 45 # 12-30",
        "ciudad": "Palmira",
        "departamento": "Valle del Cauca",
        "pais": "Colombia",
        "codigoPostal": "763533"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        bru.setCollectionVar('direccionId', json.id);"
        
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: 8. Marcar dirección 2 como principal (debe desmarcar la 1)
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/direcciones/{{direccionId2}}/principal"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: "http://localhost:8080 "

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

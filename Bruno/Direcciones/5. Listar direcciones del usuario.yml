info:
  name: 5. Listar direcciones del usuario
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/direcciones"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: "http://localhost:8080 "

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: Crear Catetegoria
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/categorias"
  body:
    type: json
    data: '{ "nombre": "Gamming" }'
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

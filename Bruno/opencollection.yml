opencollection: 1.0.0

info:
  name: Bruno
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: direccionId
      value:
        type: number
        data: "3"
    - name: ordenId
      value:
        type: number
        data: "2"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

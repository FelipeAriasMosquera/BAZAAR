info:
  name: 12. Reactivar Usuario Admin
  type: http
  seq: 12

http:
  method: PATCH
  url: "{{baseUrl}}/api/usuarios/{{id}}/reactivar"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: 09. Cambiar Contraseña
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/api/usuarios/me/password"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

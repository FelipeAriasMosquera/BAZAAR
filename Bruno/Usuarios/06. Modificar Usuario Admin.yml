info:
  name: 06. Modificar Usuario Admin
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/api/usuarios/4/roles"
  body:
    type: json
    data: |-
      {
        "roles": ["COMPRADOR", "VENDEDOR"]
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: 8. Vaciar carrito completo
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/carrito"
  auth: inherit

runtime:
  variables:
    - name: usuarioId
      value: "5"
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

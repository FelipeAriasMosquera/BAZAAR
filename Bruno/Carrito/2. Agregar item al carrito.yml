info:
  name: 2. Agregar item al carrito
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/carrito/items"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "productoId": {{productoId}},
        "cantidad": 2
      }
  auth:
    type: bearer
    token: eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiJBQGJhemFhci5jb21tIiwicm9sIjoiVkVOREVET1IsQ09NUFJBRE9SIiwiaWF0IjoxNzkyNzE3MzQxLCJleHAiOjE3OTI4MDM3NDF9.aYf6E1oGNpL_GPSfuBnb1pK2FJNmvhyaFhyUvydCUMJBCy1qrgrWguf79DLdDSg9

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080
    - name: productoId
      value: "13"
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        if (json.items && json.items.length > 0) {\r

        \    bru.setCollectionVar('itemId', json.items[0].id);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: 2. Agregar item al carrito
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/carrito/items"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "productoId": {{productoId}},
        "cantidad": 2
      }
  auth:
    type: bearer
    token: eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiJGZWxpcGlob0BiYXphYXIuY29tbSIsInJvbCI6IkNPTVBSQURPUiIsImlhdCI6MTc5MTUwNzI5NSwiZXhwIjoxNzkxNTkzNjk1fQ.ogFY7yNrsLzwTiT-r_EdKhH8ztj8NufGtwii59S2O_lLzyNeaDip8uLzMMXhuL3e

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        if (json.items && json.items.length > 0) {\r

        \    bru.setCollectionVar('itemId', json.items[0].id);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

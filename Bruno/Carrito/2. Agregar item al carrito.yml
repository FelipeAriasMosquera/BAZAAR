info:
  name: 2. Agregar item al carrito
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/carrito/items"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "productoId": {{productoId}},
        "cantidad": 1
      }
  auth:
    type: bearer
    token: eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiJGZWxpcGlob0BiYXphYXIuY29tbSIsInJvbCI6IkNPTVBSQURPUiIsImlhdCI6MTc5MzMyMjQ1OSwiZXhwIjoxNzkzNDA4ODU5fQ.pPxMgi-bhPeZy0XtcJ6vWELZ9rwqXLYd9-OYbs7qf497btASpOtBCbkvmIMBUFao

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080
    - name: productoId
      value: "2"
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        if (json.items && json.items.length > 0) {\r

        \    bru.setCollectionVar('itemId', json.items[0].id);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

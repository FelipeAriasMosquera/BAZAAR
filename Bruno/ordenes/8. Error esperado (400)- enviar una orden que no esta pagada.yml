info:
  name: "8. Error esperado (400): enviar una orden que no esta pagada"
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/api/ordenes/{{ordenId}}/enviar"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

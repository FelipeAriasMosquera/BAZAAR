info:
  name: 9. Cancelar la orden (repone el stock)
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/ordenes/{{ordenId}}/cancelar"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

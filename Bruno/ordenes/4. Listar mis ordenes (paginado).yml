info:
  name: 4. Listar mis ordenes (paginado)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/ordenes?page=0&size=10"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: 5. Ver una orden (estado 'pendiente', precios congelados)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/ordenes/{{ordenId}}"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: "7. Error esperado (400): checkout con carrito vacio"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/ordenes"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "direccionId": {{direccionId}}
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

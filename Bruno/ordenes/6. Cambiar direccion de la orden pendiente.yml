info:
  name: 6. Cambiar direccion de la orden pendiente
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/api/ordenes/{{ordenId}}/direccion"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "direccionId": {{direccionId}}
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

  body:
    type: json
    data: |-
      {
        "direccionId": {{direccionId}}
      }
  auth:
    type: bearer
    token: eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiJQZXBlQGJhemFhci5jb21tIiwicm9sIjoiQ09NUFJBRE9SIiwiaWF0IjoxNzkyNTU1MDU0LCJleHAiOjE3OTI2NDE0NTR9.CqB0Tybkb916WMFEnYSOuf_r80EgW_Go-EoPaDlrnUx0RYUPjqG3vpjyXTvWGKmw

runtime:

info:
  name: 1. Listar mis notificaciones
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/notificaciones?page=0&size=10"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const body = res.getBody();\r

        if (body.content && body.content.length > 0) {\r

        \    bru.setCollectionVar('notificacionId', body.content[0].id);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

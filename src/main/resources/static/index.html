<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bazaar - Prueba Usuarios</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        input { display: block; width: 100%; margin: 5px 0; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 15px; margin-top: 5px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; word-break: break-all; }
        #sesion { font-weight: bold; color: green; }
    </style>
</head>
<body>

<h1>Bazaar - Panel de pruebas</h1>
<p id="sesion">Sin sesión iniciada</p>

<section>
    <h2>Registro</h2>
    <input id="reg-nombre" placeholder="Nombre">
    <input id="reg-email" placeholder="Email">
    <input id="reg-password" type="password" placeholder="Contraseña">
    <input id="reg-telefono" placeholder="Teléfono">
    <button onclick="registrar()">Registrarse</button>
</section>

<section>
    <h2>Login</h2>
    <input id="login-email" placeholder="Email">
    <input id="login-password" type="password" placeholder="Contraseña">
    <button onclick="login()">Iniciar sesión</button>
</section>

<section>
    <h2>Mi perfil</h2>
    <button onclick="verPerfil()">Ver mi perfil</button>
    <input id="perfil-nombre" placeholder="Nuevo nombre">
    <input id="perfil-telefono" placeholder="Nuevo teléfono">
    <button onclick="actualizarPerfil()">Actualizar perfil</button>
    <button onclick="convertirseVendedor()">Convertirme en vendedor</button>
</section>

<section>
    <h2>Admin</h2>
    <button onclick="listarUsuarios()">Listar todos los usuarios</button>
    <h3>Desactivar usuario</h3>
    <input id="admin-id-desactivar" placeholder="ID del usuario a desactivar">
    <button onclick="desactivarUsuario()">Desactivar</button>
    <h3>Reactivar usuario</h3>
    <input id="admin-id-reactivar" placeholder="ID del usuario a reactivar">
    <button onclick="reactivarUsuario()">Reactivar</button>
</section>

<h3>Respuesta:</h3>
<pre id="resultado">—</pre>

<script src="js/app.js"></script>
</body>
</html>
